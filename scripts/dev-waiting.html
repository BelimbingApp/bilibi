<!-- Local launcher diagnostics only; injected by local-https-api.py, never by
     install-server.sh. Launcher plumbing has no Bilimbi module counterpart. -->
<style>
.dev-status .column{max-width:48rem}
.dev-status .hint,.dev-status #waiting-state,.dev-status .dot{display:none}
.dev-status .status{justify-content:flex-end}
.dev-progress{margin-top:1rem;font-size:.875rem;font-variant-numeric:tabular-nums}
.dev-output{margin:1rem 0 0;padding:.75rem;border:1px solid var(--line);border-radius:.375rem;max-height:24rem;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--canvas);color:var(--ink)}
.dev-output .ansi-green{color:#166534}.dev-output .ansi-yellow{color:#92400e}.dev-output .ansi-red{color:#b91c1c}.dev-output .ansi-bold{font-weight:700}
@media (prefers-color-scheme:dark){.dev-output .ansi-green{color:#86efac}.dev-output .ansi-yellow{color:#fcd34d}.dev-output .ansi-red{color:#fca5a5}}
.dev-output:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
</style>
<template id="dev-status-template">
<div class="dev-progress" id="dev-progress" role="status" aria-live="polite"></div>
<p id="dev-next" hidden>Fix the error and save a source file to rebuild and retry, or stop the launcher and run ./bilibi start again.</p>
<pre class="dev-output" id="dev-output" aria-label="Latest build output" tabindex="0" hidden></pre>
</template>
<script>
(function () {
  var labels = {prepare:'Preparing', discovery:'Discovering modules', css:'Building CSS', build:'Building', migrate:'Migrating the database', seed:'Preparing the development account', start:'Starting', serve:'Starting'};
  var failures = {discovery:'Module discovery failed', css:'CSS build failed', build:'Rust build failed', migrate:'Database migration failed', seed:'Development account setup failed', start:'App failed to start', serve:'App stopped'};
  var latest = null, received = 0, unavailable = false, busy = false;
  var waiting = document.documentElement;
  var template = document.getElementById('dev-status-template');
  // The shared waiting page still owns backend polling and automatic reload.
  document.querySelector('.body').insertBefore(template.content, document.querySelector('.status'));
  var progress = document.getElementById('dev-progress');
  var output = document.getElementById('dev-output');
  var next = document.getElementById('dev-next');
  // Announce progress changes without re-announcing the whole diagnostic tail.
  document.querySelector('.card').removeAttribute('role');
  document.querySelector('.card').removeAttribute('aria-live');
  function renderOutput(text) {
    var fragment = document.createDocumentFragment(), colour = '', bold = false, offset = 0;
    var codes = /\x1b\[([0-9;]*)m/g, match;
    function append(value) {
      if (!value) return;
      var span = document.createElement('span');
      if (colour) span.classList.add('ansi-' + colour);
      if (bold) span.classList.add('ansi-bold');
      span.textContent = value;
      fragment.appendChild(span);
    }
    while ((match = codes.exec(text))) {
      append(text.slice(offset, match.index));
      (match[1] || '0').split(';').forEach(function (code) {
        if (code === '0') { colour = ''; bold = false; }
        else if (code === '1') bold = true;
        else if (code === '22') bold = false;
        else if (code === '31' || code === '91') colour = 'red';
        else if (code === '32' || code === '92') colour = 'green';
        else if (code === '33' || code === '93') colour = 'yellow';
        else if (code === '39' || /^(3[0-7]|9[0-7])$/.test(code)) colour = '';
      });
      offset = codes.lastIndex;
    }
    append(text.slice(offset));
    output.replaceChildren(fragment);
  }
  function render() {
    if (!latest && !unavailable) return;
    waiting.classList.add('dev-status');
    if (unavailable) {
      document.getElementById('waiting-heading').textContent = 'Bilibi could not start';
      document.getElementById('waiting-text').textContent = 'Run ./bilibi start to start Bilibi.';
      progress.textContent = '';
      progress.setAttribute('role', 'alert');
      progress.setAttribute('aria-live', 'assertive');
      next.hidden = true;
      output.hidden = true;
      return;
    }
    var elapsed = Math.max(0, Math.floor(latest.elapsed + (latest.finished_at ? 0 : (performance.now() - received) / 1000)));
    var duration = (elapsed >= 60 ? Math.floor(elapsed / 60) + 'm ' : '') + elapsed % 60 + 's';
    var label = labels[latest.phase] || 'Starting';
    progress.textContent = latest.failed ? (failures[latest.phase] || label + ' failed') + ' (' + duration + ').' : label + ' (' + duration + ')…';
    progress.setAttribute('role', latest.failed ? 'alert' : 'status');
    progress.setAttribute('aria-live', latest.failed ? 'assertive' : 'polite');
    document.getElementById('waiting-heading').textContent = latest.failed ? 'Bilibi could not start' : 'Bilibi is starting';
    document.getElementById('waiting-text').textContent = latest.failed ? 'Fix the error shown below to start Bilibi.' : "You can continue when it's ready; this page will reload automatically.";
    next.hidden = !latest.failed;
    var tail = latest.output || '';
    if (output.dataset.tail !== tail) {
      var atEnd = output.hidden || output.scrollHeight - output.clientHeight - output.scrollTop < 24;
      renderOutput(tail);
      output.dataset.tail = tail;
      output.hidden = !tail;
      if (atEnd) output.scrollTop = output.scrollHeight;
    }
    output.hidden = !tail;
  }
  function poll() {
    if (busy) return;
    busy = true;
    fetch('/__bilibi_dev/status', {cache:'no-store', credentials:'omit', signal:AbortSignal.timeout(4000)})
      .then(function (response) { if (!response.ok) throw new Error('unavailable'); return response.json(); })
      .then(function (data) { latest = data; received = performance.now(); unavailable = false; render(); })
      .catch(function () { unavailable = true; render(); })
      .finally(function () { busy = false; });
  }
  setInterval(function () { render(); poll(); }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  poll();
})();
</script>
