{#- The enrollment QR code (src/two_factor/qr.rs): one path of dark modules
    on a white square with the quiet zone included, scaled by CSS. -#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{ size }} {{ size }}" shape-rendering="crispEdges" role="img" aria-label="{{ label }}" class="size-48 rounded-md border border-line"><rect width="{{ size }}" height="{{ size }}" fill="#ffffff"/><path d="{{ path }}" fill="#000000"/></svg>
