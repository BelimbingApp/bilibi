{#- Change Password: a hand-written disclosure
    trigger until the shared disclosure lands, over the
    admin password form. The form raises `update_password` with its values. -#}
{% import "components.html" as ui %}
<button type="button" id="toggle-change-password-btn" data-event="toggle_change_password" class="flex items-center gap-2 w-full text-left group cursor-pointer focus:outline-none"><span class="shrink-0 text-ink-muted w-3 grid place-items-center" aria-hidden="true">{% if open %}{% call ui::icon(name="collapse", class="size-3") %}{% endcall %}{% else %}{% call ui::icon(name="expand", class="size-3") %}{% endcall %}{% endif %}</span><h3 class="text-[11px] uppercase tracking-wider font-semibold text-ink-subtle">Change Password</h3></button>
{% if open %}<div id="change-password-form-container" class="mt-4 max-w-md"><form id="user-password-form" data-event="update_password" class="space-y-4" novalidate><div>{{ password }}</div><div>{{ confirmation }}</div>{{ submit }}</form></div>{% endif %}
