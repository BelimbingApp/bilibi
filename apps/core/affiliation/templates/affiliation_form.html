{# The add box under the section heading; it submits once and keeps its draft on refusal. #}
<form id="{{ id }}" data-event="add_affiliation" class="mb-3 rounded-lg border border-line bg-surface-sunken p-3" novalidate>
  <div class="grid grid-cols-1 gap-x-4 gap-y-1 md:grid-cols-3">{% for control in controls %}{{ control }}{% endfor %}</div>
  {% if !notice.is_empty() %}<p id="{{ id }}-notice" role="alert" class="mt-1 text-xs text-danger-ink">{{ notice }}</p>{% endif %}
  <div class="mt-2 flex items-center justify-end gap-2">{{ cancel }}{{ submit }}</div>
</form>
