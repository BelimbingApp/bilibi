{%- import "components.html" as ui -%}
{%- import "dialog.html" as d -%}
<template id="tpl-modal">{% call d::modal(id="design-library-modal", title="Rename example company", cancel_event="close-modal", description="Changes stay in this preview.") %}
<form id="design-library-modal-form" class="mt-4 space-y-4"><label class="block text-sm font-medium text-ink" for="design-library-modal-name">Company name</label><input id="design-library-modal-name" name="name" value="Acme Holdings" class="block w-full rounded-md border border-high-contrast-line bg-surface px-3 py-2 text-sm text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-strong/30"><div class="flex justify-end gap-2">{% call ui::button(button_type="button", event="close-modal") %}Cancel{% endcall %}{% call ui::button(button_type="submit", variant=bilibi_ui::ButtonVariant::Primary, event="close-modal") %}Save{% endcall %}</div></form>
{% endcall %}</template>
<template id="tpl-wide-modal">{% call d::modal(id="design-library-wide-modal", title="Edit example company", cancel_event="close-modal", width=bilibi_ui::ModalWidth::Wide) %}
<form id="design-library-wide-modal-form" class="mt-4 space-y-4"><div class="grid gap-4 sm:grid-cols-2"><div><label class="block text-sm font-medium text-ink" for="design-library-wide-modal-name">Company name</label><input id="design-library-wide-modal-name" name="name" value="Acme Holdings" class="block w-full rounded-md border border-high-contrast-line bg-surface px-3 py-2 text-sm text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-strong/30"></div><div><label class="block text-sm font-medium text-ink" for="design-library-wide-modal-code">Code</label><input id="design-library-wide-modal-code" name="code" value="ACME" class="block w-full rounded-md border border-high-contrast-line bg-surface px-3 py-2 text-sm text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-strong/30"></div></div><div class="flex justify-end gap-2">{% call ui::button(button_type="button", event="close-modal") %}Cancel{% endcall %}{% call ui::button(button_type="submit", variant=bilibi_ui::ButtonVariant::Primary, event="close-modal") %}Save{% endcall %}</div></form>
{% endcall %}</template>
<template id="tpl-long-modal">{% call d::modal(id="design-library-long-modal", title="Terms of the example agreement", cancel_event="close-modal", description="The dialog never scrolls; its body does.") %}
<div id="design-library-long-modal-text" class="mt-4 space-y-3 text-sm text-ink">{% for n in long_paragraphs %}<p>Clause {{ n }}. The parties agree that this paragraph exists to make the dialog body taller than the viewport, so the body scrolls inside the rounded surface while the title stays attached to the top of the content.</p>{% endfor %}</div>
<div class="mt-5 flex justify-end gap-2">{% call ui::button(button_type="button", variant=bilibi_ui::ButtonVariant::Primary, event="close-modal") %}Close{% endcall %}</div>
{% endcall %}</template>
<template id="tpl-flash-modal">{% call d::modal(id="design-library-flash-modal", title="Dialog that owns the flash", cancel_event="close-modal", description="Messages for this dialog appear inside it.", owns_flash=true, messages=flash_in_dialog) %}
<div class="mt-5 flex justify-end gap-2">{% call ui::button(button_type="button", variant=bilibi_ui::ButtonVariant::Primary, event="close-modal") %}Close{% endcall %}</div>
{% endcall %}</template>
