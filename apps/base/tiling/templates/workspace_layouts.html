{#- Shared workspaces (Bilimbi `WorkspaceLive` layouts dialog). -#}
{%- import "components.html" as ui -%}
<div id="workspace-shared-layouts">
{{ shared|safe }}
{%- if can_publish %}
<a id="workspace-manage-shared" href="/workspace/shared-layouts" class="text-sm text-link underline">Manage shared workspaces</a>
{%- endif %}
{%- if let Some(href) = publish_href %}
<a id="workspace-publish-current" href="{{ href }}" class="ml-3 text-sm text-link underline">Share current tiles</a>
{%- endif %}
</div>
