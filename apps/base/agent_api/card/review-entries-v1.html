<!doctype html>
<!-- Shared operation review, owned by base/agent_api. No Bilimbi counterpart.
     A sandboxed MCP App: no credentials, external assets or independent write path.
     Semantic color fallbacks mirror base/ui app.css (DESIGN.md). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review entries</title><style>

  --warning: #f59e0b; --warning-surface: #451a03; --warning-line: #92400e; --warning-ink: #fde68a;

:focus-visible { outline:2px solid var(--brand-strong); outline-offset:2px; }

textarea { resize:vertical; }
#banner { padding:12px; border-left:5px solid var(--info); background:var(--info-surface); color:var(--info-ink); }

.identity { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-weight:700; font-size:14px; }

.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.grow { flex:1; } .muted { color:var(--color-text-secondary,var(--ink-muted)); }

.grid-scroll { overflow:auto; max-height:60vh; }

td .field { min-width:160px; }
td .field>label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }

.state { display:block; margin-top:4px; font-size:11px; }
.status { padding:8px 12px; border-radius:6px; background:var(--info-surface); color:var(--info-ink); }
.status[data-tone=danger] { background:var(--danger-surface); color:var(--danger-ink); }

.more { padding:8px 12px; justify-content:space-between; }
#actions { position:sticky; bottom:0; padding:8px 0; background:var(--color-background-primary,var(--surface)); }
.preview { padding:12px; display:grid; gap:8px; }
.preview>article { border-top:1px solid var(--line); padding-top:8px; }
summary { cursor:pointer; font-weight:600; }
dl { margin:4px 0 8px; } dl>div { display:grid; grid-template-columns:minmax(100px,1fr) minmax(0,3fr); gap:8px; padding:3px 0; border-bottom:1px solid var(--line); }
dt { color:var(--ink-muted); } dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
a { color:var(--color-text-info,var(--info)); }
.suggestions { display:grid; gap:4px; max-height:180px; overflow:auto; }
.suggestions button { text-align:left; white-space:normal; }
progress { width:100%; height:6px; accent-color:var(--action); }
fieldset { border:1px solid var(--line); border-radius:6px; padding:8px; min-width:0; }
legend { font-size:11px; color:var(--ink-muted); }
@media(max-width:500px) { main { padding:8px; } dl>div { grid-template-columns:1fr; gap:2px; } .preview { padding:8px; } }
@media(pointer:coarse) { input,select { min-height:40px; } }
</style></head><body>
<header id="banner" role="status"><div class="identity"><span class="role" id="role">Bilibi</span><span id="instance">Connecting…</span></div><p id="origin"></p><p id="notice"></p></header>
<main><div class="row"><div class="grow"><h1 id="title">Review entries</h1><p class="muted" id="subtitle">Edit the draft, then update the review before approving.</p></div><button id="fullscreen" hidden>Expand grid</button></div>
<div id="status" class="status" role="status" aria-live="polite">Connecting to Bilibi…</div>
<div id="editor" class="card"></div>
<div class="row" id="row-actions"><button id="add">+ Add entry</button><span class="muted" id="paste-hint">Paste spreadsheet cells into a field. Empty pasted cells are omitted. Tab moves between cells; Alt + arrows moves across rows and columns.</span></div>
<section id="reviews" class="card preview" aria-label="Review of changes" hidden></section>
<div id="stepup" class="card preview" hidden></div>
<div id="actions" class="row"><button id="update">Update review</button><button id="stop" hidden>Stop</button><button id="approve" class="primary" disabled>Approve</button><button id="cancel" class="danger">Cancel</button><span id="progress-label" class="muted" aria-live="polite"></span></div>
<progress id="progress" hidden max="1" value="0" aria-label="Batch progress"></progress>
</main><script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clone = value => JSON.parse(JSON.stringify(value));
const label = key => key.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
const RENDER_STEP=50;
function fields(schema) {
  const required=schema.required||[];
  const rank=([key,value])=>required.includes(key)?required.indexOf(key):required.length+(['object','array'].includes(value.type)?2:1);
  return Object.entries(schema.properties||{}).sort((a,b)=>rank(a)-rank(b));
}
const restricted = value => value && typeof value === 'object' && value.restricted === true;
const unwrap = value => value && Object.hasOwn(value,'result') ? value.result : value;
function el(tag, attributes={}, children=[]) {

  for(const [key,value] of Object.entries(attributes)) {
    if(value===undefined || value===null || value===false) continue;
    if(key==='text') node.textContent=value;
    else if(key.startsWith('on')) node.addEventListener(key.slice(2),value);
    else node.setAttribute(key,value===true?'':value);
  }

}
const state={ data:null, rows:[], fields:[], plans:[], busy:false, planning:false, stopRequested:false, cancelled:false, uncertain:false, revision:0, next:0, choices:new Map(), stepup:false, renderedRows:RENDER_STEP, renderedReviews:RENDER_STEP };
const pending=new Map();
const prefix=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
let sequence=0, hostOrigin=null, host={};
function post(message) { parent.postMessage(message,hostOrigin && hostOrigin!=='null'?hostOrigin:'*'); }
function request(method,params) {
  return new Promise((resolve,reject)=>{
    const id=prefix+'-'+ ++sequence;
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The host did not answer.'));},60000);
    pending.set(id,{resolve,reject,timer});post({jsonrpc:'2.0',id,method,params});
  });
}
function notify(method,params) { post({jsonrpc:'2.0',method,params}); }
async function tool(name,args) {
  const answer=await request('tools/call',{name,arguments:args});
  let body=answer.structuredContent;
  if(body===undefined) { const text=(answer.content||[]).find(c=>c.type==='text');body=text?JSON.parse(text.text):{}; }
  return {body,failed:!!answer.isError};
}
function context(result, extra={}) {
  // Never send drafts, plan codes, credential bindings or 2FA codes to the model.
  request('ui/update-model-context',{content:[{type:'text',text:result}],structuredContent:{
    instance:state.data?.instance,key:state.data?.key,meta:state.data?.meta,
    rows:state.rows.map((row,index)=>({row:index+1,state:row.state, ...(row.state==='done'?{result:row.result}:{}), ...(row.error?{error:row.error}:{})})),...extra
  }}).catch(()=>{});
}
function status(text,tone='info') { $('status').textContent=text;$('status').dataset.tone=tone;$('status').setAttribute('role',tone==='danger'||tone==='warning'?'alert':'status'); }
function applyHost(context) {
  host={...host,...context};
  document.documentElement.dataset.theme=host.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  for(const [name,value] of Object.entries(context.styles?.variables||{})) {
    if(/^--[a-z0-9-]+$/.test(name)&&typeof value==='string') document.documentElement.style.setProperty(name,value);
  }
  if(context.locale) document.documentElement.lang=context.locale;
  $('fullscreen').hidden=!host.availableDisplayModes?.includes('fullscreen');
  $('fullscreen').textContent=host.displayMode==='fullscreen'?'Exit fullscreen':'Expand grid';
  if(state.rows.length>=10&&!state.expanded&&host.availableDisplayModes?.includes('fullscreen')) {state.expanded=true;request('ui/request-display-mode',{mode:'fullscreen'}).then(result=>applyHost({displayMode:result.mode})).catch(()=>{});}
}
window.addEventListener('message',event=>{

  const message=event.data;
  if(!message||message.jsonrpc!=='2.0') return;

  else if(message.method==='ui/notifications/host-context-changed') applyHost(message.params||{});
  else if(message.method==='ui/notifications/tool-cancelled') cancel();
  else if(message.method==='ui/resource-teardown') {
    state.cancelled=true;state.revision++;state.plans=[];
    for(const waiter of pending.values()){clearTimeout(waiter.timer);waiter.reject(new Error('The card closed.'));}pending.clear();

new ResizeObserver(()=>notify('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)})).observe(document.body);
function busy(value) {state.busy=value;buttons();}
function buttons() {
  const terminal=state.cancelled||state.uncertain;
  $('update').disabled=state.busy||terminal||!state.data||!state.rows.some(row=>row.state==='draft');
  $('approve').disabled=state.busy||terminal||!state.plans.length||state.stepup||state.plans.some(p=>Date.parse(p.plan.expires_at)<=Date.now());
  $('cancel').disabled=state.busy||terminal||!state.data||!state.rows.some(row=>row.state==='draft'||row.state==='excluded');
  $('add').disabled=state.busy||terminal||!state.data||state.rows.some(row=>row.state==='done')||state.rows.length>=state.data.review_max_entries;
  $('stop').hidden=!state.planning;$('stop').disabled=!state.planning||state.stopRequested;
  for(const control of $('editor').querySelectorAll('input,select,textarea,button')) control.disabled=state.busy||terminal||control.dataset.locked==='true';
  $('approve').textContent='Approve'+(state.plans.length?' '+state.plans.reduce((n,p)=>n+p.rows.length,0)+' on '+state.data.instance.label:'');
}
setInterval(buttons,1000);
function invalidate() {
  state.revision++;state.plans=[];state.next=0;state.stepup=false;$('stepup').hidden=true;$('stepup').replaceChildren();
  for(const row of state.rows)if(row.state==='draft'){row.preview=null;row.error=null;row.fields={};}
  state.renderedReviews=RENDER_STEP;$('reviews').hidden=true;$('progress').hidden=true;$('progress').value=0;$('progress-label').textContent='';
  status('Draft changed. Update the review before approving.');buttons();
}
function newRow(input={}) {return {input:clone(input),edited:new Set(),unresolved:new Map(),state:'draft',fields:{},preview:null,error:null};}
function banner(instance) {
  state.data.instance=clone(instance);
  $('instance').textContent=instance.label;$('role').textContent=instance.role;$('origin').textContent=instance.origin;$('notice').textContent=instance.notice;
  $('banner').className=instance.production||instance.environment==='production'?'production':instance.environment==='staging'?'staging':'';
}
async function opened(answer) {
  if(state.data)return; // A host replay must never reset a completed or cancelled review.
  let data=answer?.structuredContent;
  if(data===undefined) {const text=answer?.content?.find(c=>c.type==='text');data=text?JSON.parse(text.text):{};}
  if(answer?.isError||!data.operation)throw new Error(data.error||'Bilibi could not open this review.');
  state.data=data;state.rows=data.entries.map(newRow);state.renderedRows=Math.min(RENDER_STEP,state.rows.length);applyHost({});state.fields=fields(data.operation.input);
  banner(data.instance);
  $('title').textContent=data.operation.title;
  status('Loading choices…');busy(true);
  async function choices(schema) {
    if(schema['x-bilibi-picklist']) {
      const key=schema['x-bilibi-picklist'];
      if(!state.choices.has(key)) {
        const read=await tool('read',{key:'base.picklists.values',input:{list:key}});
        const values=unwrap(read.body);
        state.choices.set(key,read.failed?{error:read.body}:Array.isArray(values)?values:values?.values||[]);

    for(const child of Object.values(schema.properties||{}))await choices(child);
    if(schema.items)await choices(schema.items);

  try {await choices(data.operation.input);} finally {busy(false);renderEditor();}

}
function setValue(object,path,value) {
  let target=object;
  for(let i=0;i<path.length-1;i++) {
    if(!target[path[i]]||typeof target[path[i]]!=='object')target[path[i]]={};
    target=target[path[i]];
  }
  if(value===undefined)delete target[path.at(-1)];else target[path.at(-1)]=value;

function getValue(object,path) {return path.reduce((o,key)=>o?.[key],object);}
const pathKey = path => JSON.stringify(path);
const clearableString = schema => schema.type==='string'&&!schema.enum&&!schema.format&&!schema.writeOnly&&!schema['x-bilibi-reference']&&!schema['x-bilibi-picklist']&&!schema['x-bilibi-money'];
function edited(row,path) {

  return false;
}
function plannedInput(row) {
  const input=clone(row.input);

    if(!schema||value===null||typeof value!=='object')return;

function clearedFields(row) {
  const names=[];

    if(!schema||value===null||typeof value!=='object')return;
    if(schema.type==='array') {if(Array.isArray(value))value.forEach((item,index)=>collect(schema.items,item,[...path,index]));return;}
    for(const [key,child]of Object.entries(schema.properties||{}))if(Object.hasOwn(value,key))collect(child,value[key],[...path,key]);

function control(row,schema,path,required=false,position={}) {

  const box=el('div',{class:'field'});
  const locked=restricted(value)||row.state==='done'||row.state==='excluded'||row.restricted?.has(key);
  const errors=el('span',{class:'error',id:id+'-error',text:(row.fields[key]||[]).join(' ')});
  function change(value) {setValue(row.input,path,value);row.edited.add(pathKey(path));invalidate();}
  box.append(el('label',{for:id,text:name+(required?' *':'')}));
  if(locked&&row.state!=='done'&&row.state!=='excluded') {box.append(el('span',{text:'Restricted'}));return box;}
  if(schema.type==='object') {
    if(!required&&value===undefined) {box.append(el('button',{type:'button',text:'+ '+name,'data-locked':locked,onclick:()=>{change({});renderEditor();}}));return box;}
    const section=el('fieldset',{},[el('legend',{text:name})]);
    for(const [key,child]of fields(schema))section.append(control(row,child,[...path,key],schema.required?.includes(key),position));

  }
  if(schema.type==='array') {
    const list=el('div');
    const items=Array.isArray(value)?value:[];
    for(let i=0;i<items.length;i++) {
      const item=control(row,schema.items,[...path,i],true,position);
      item.append(el('button',{type:'button',text:'Remove item','data-locked':locked,onclick:()=>{items.splice(i,1);change(items);renderEditor();}}));list.append(item);
    }
    box.append(list,el('button',{type:'button',text:'+ Add item','data-locked':locked,onclick:()=>{change([...items,schema.items.type==='object'?{}:schema.items.type==='boolean'?false:'']);renderEditor();}}));return box;
  }
  let input;
  const picklist=schema['x-bilibi-picklist'];
  let values=schema.enum?.map(value=>({value,label:String(value)}));

    if(Array.isArray(choices))values=choices.filter(v=>v.status!=='retired').map(v=>({value:v.code,label:v.label}));
