# Reference CI for a Bilibi Domain or Extension repository. Copy it to
# .github/workflows/ci.yml, set CONTAINER_ROLE and CONTAINER_ID, and keep the
# Platform revision in .github/bilibi-revision (one commit SHA of
# BelimbingApp/bilibi). The repository is not buildable alone: it mounts at
# apps/<role>/<container> in a Platform checkout, and scripts/domain-ci.sh
# runs the Platform's own gates over the composed workspace.
# A vX.Y.Z tag also opens the catalogue pull request on Bilibi. Official
# repositories need the BILIBI_CATALOGUE_TOKEN secret (docs/versions.md).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # A vX.Y.Z tag is a release. The catalogue job below opens the Bilibi
      # catalogue pull request after the gates pass (docs/versions.md).
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CONTAINER_ROLE: domains # domains, or extensions for an Extension
  CONTAINER_ID: container_id # snake_case; the folder name and bilibi.container.toml id

jobs:
  mounted:
    name: Mounted in Bilibi
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: postgres://bilibi:bilibi@localhost:5432/bilibi
      # Pull requests lint and boot a debug build. Pushes to main do the
      # locked release build. An older Platform script ignores this and
      # always release-builds.
      DOMAIN_CI_BUILD: ${{ github.event_name == 'pull_request' && 'check' || 'release' }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bilibi
          POSTGRES_PASSWORD: bilibi
          POSTGRES_USER: bilibi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilibi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: bilibi

    steps:
      # Tags are fetched so the pin names the release this repository is at.
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: container
          fetch-tags: true

      - name: Read the pinned Platform revision
        id: pin
        working-directory: .
        run: echo "revision=$(tr -d '[:space:]' < container/.github/bilibi-revision)" >> "$GITHUB_OUTPUT"

      - name: Check out Bilibi
        uses: actions/checkout@v7
        with:
          repository: BelimbingApp/bilibi
          ref: ${{ steps.pin.outputs.revision }}
          path: bilibi
          fetch-tags: true

      # The mount folder is the container ID. Moving the checkout keeps its
      # .git, so the container stays an independent nested repository that the
      # Platform's .gitignore ignores.
      - name: Mount the container
        working-directory: .
        run: mv container "bilibi/apps/$CONTAINER_ROLE/$CONTAINER_ID"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Keep pull-request debug builds small
        if: env.DOMAIN_CI_BUILD == 'check'
        run: echo CARGO_PROFILE_DEV_DEBUG=0 >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: bilibi
          prefix-key: v1-workspace
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bilibi/apps/base/ui/assets/package-lock.json
      - run: npm ci --prefix apps/base/ui/assets --no-audit --no-fund

      # Discovery, committed CSS, Cargo.lock pinning, fmt, clippy -D warnings,
      # a debug build on a pull request or the locked release build on main,
      # migrate, seed-production, and GET /.
      - name: Run the mounted gates
        run: ./scripts/domain-ci.sh

      # The gates change only the composition files and Cargo.lock; the
      # container repository itself must stay untouched.
      - name: Verify the gates left the container clean
        run: git -C "apps/$CONTAINER_ROLE/$CONTAINER_ID" diff --exit-code

      # Saved with the cache, so a pull request starts from main's debug build.
      - name: Warm the debug build for pull requests
        if: env.DOMAIN_CI_BUILD == 'release'
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --locked -p bilibi-web

  # A release tag of an official Domain or Extension opens a catalogue pull
  # request on Bilibi. A repository that is not in catalogue.json does nothing.
  # An official one fails here until BILIBI_CATALOGUE_TOKEN is set
  # (docs/versions.md#secret-the-owner-adds). Copy this job with the rest of
  # the file. Write .github/bilibi-platform (one line, for example
  # ">=0.1.0, <0.2.0") only when the Platform requirement changes.
  catalogue:
    name: Propose the catalogue entry
    needs: mounted
    if: startsWith(github.ref, 'refs/tags/v') && needs.mounted.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the Bilibi catalogue tools
        uses: actions/checkout@v7
        with:
          repository: BelimbingApp/bilibi
          ref: main
          path: bilibi
          persist-credentials: false

      - name: Open the catalogue pull request
        env:
          BILIBI_CATALOGUE_TOKEN: ${{ secrets.BILIBI_CATALOGUE_TOKEN }}
        run: |
          python3 bilibi/scripts/catalogue.py open-release \
            --role "$CONTAINER_ROLE" \
            --id "$CONTAINER_ID" \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --released "$(git show -s --format=%cs "$GITHUB_SHA")" \
            --revision "$(tr -d '[:space:]' < .github/bilibi-revision)" \
            --platform-file .github/bilibi-platform
