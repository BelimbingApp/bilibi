# Mount every official Domain and Extension from catalogue.json and run the
# shared mounted gates. Companion branches are selected only on pull requests
# (docs/versions.md); main pushes always check main HEADs. Tags and manual runs
# retain the existing Domain tested-set recording and catalogue publishing.
name: Domains on this change

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      domains_at:
        description: Take each Domain and Extension at its latest release tag, or at its main HEAD
        type: choice
        options:
          - latest-release
          - main
        default: latest-release

permissions:
  contents: read

concurrency:
  group: domains-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  catalogue:
    name: Select official software
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_containers: ${{ steps.select.outputs.has_containers }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the catalogue and companion branches
        id: select
        run: python3 scripts/compatibility.py

  domain:
    name: ${{ matrix.role }}/${{ matrix.id }}
    needs: catalogue
    if: needs.catalogue.outputs.has_containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalogue.outputs.matrix) }}

    env:
      DATABASE_URL: postgres://bilibi:bilibi@localhost:5432/bilibi
      CONTAINER_ROLE: ${{ matrix.role }}
      CONTAINER_ID: ${{ matrix.id }}
      CONTAINER_REPOSITORY: ${{ matrix.repository }}
      CONTAINER_REF: ${{ matrix.ref }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bilibi
          POSTGRES_PASSWORD: bilibi
          POSTGRES_USER: bilibi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilibi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: bilibi

    steps:
      # Tags are fetched so the pin can name the release each side is at.
      - name: Check out this change
        uses: actions/checkout@v7
        with:
          path: bilibi
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the Domain or Extension
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: container
          fetch-depth: 0
          persist-credentials: false

      - name: Move the Domain or Extension to its latest release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.domains_at == 'latest-release')
        working-directory: container
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::$CONTAINER_REPOSITORY has no release tag yet (docs/versions.md); tag one or run this with domains_at=main"
            exit 1
          fi
          git checkout --quiet "$latest"

      # Same real nested checkout as docs/domain-ci/ci.yml.
      - name: Mount the Domain or Extension
        working-directory: .
        run: |
          mv container "bilibi/apps/$CONTAINER_ROLE/$CONTAINER_ID"
          printf 'Mounted %s (%s) at %s\n' "$CONTAINER_REPOSITORY" "$CONTAINER_REF" "$(git -C "bilibi/apps/$CONTAINER_ROLE/$CONTAINER_ID" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Each mounted container resolves a different Cargo.lock.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: bilibi
          key: ${{ matrix.role }}-${{ matrix.id }}
          cache-on-failure: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bilibi/apps/base/ui/assets/package-lock.json
      - run: npm ci --prefix apps/base/ui/assets --no-audit --no-fund

      - name: Run the mounted gates
        run: ./scripts/domain-ci.sh

      - name: Verify the gates left the Domain or Extension clean
        run: git -C "apps/$CONTAINER_ROLE/$CONTAINER_ID" diff --exit-code


      # The existing tested-set format records Domain pairs only. Extension
      # gates are equally required, without changing catalogue publishing.
      - name: Describe the tested set
        if: matrix.role == 'domains'
        run: python3 scripts/catalogue.py tested --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee "$RUNNER_TEMP/tested-set.json"
      - uses: actions/upload-artifact@v7
        if: matrix.role == 'domains'
        with:
          name: tested-${{ matrix.role }}-${{ matrix.id }}
          path: ${{ runner.temp }}/tested-set.json

      - name: Explain a compatibility failure
        if: failure()
        run: |
          message="$CONTAINER_ROLE/$CONTAINER_ID ($CONTAINER_REPOSITORY at $CONTAINER_REF) broke on this Platform change. Fix it in the same task with a companion PR linked from the Platform PR; see docs/versions.md#platform-changes-and-companion-prs."
          echo "::error::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"


  # One stable check for branch protection, independent of catalogue entries.
  compatibility:
    name: Official compatibility
    needs: [catalogue, domain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every official Domain and Extension to pass
        env:
          SELECTION: ${{ needs.catalogue.result }}
          MOUNTED: ${{ needs.domain.result }}
          HAS_CONTAINERS: ${{ needs.catalogue.outputs.has_containers }}
        run: |
          if [ "$SELECTION" = success ] && { [ "$MOUNTED" = success ] || { [ "$HAS_CONTAINERS" = false ] && [ "$MOUNTED" = skipped ]; }; }; then
            echo 'Every official Domain and Extension passed.'
          else
            echo '::error::Official compatibility failed. Read the failing domains/<id> or extensions/<id> job. A break requires a companion PR in the same task, linked from the Platform PR (docs/versions.md#platform-changes-and-companion-prs).'
            exit 1
          fi

  # Publishes catalogue.json from this change plus every tested set so far to
  # the `catalogue` branch (docs/versions.md). Only release tags and hand runs
  # record; a pull request or a push to main never writes anything.
  record:
    name: Record the tested sets
    needs: domain
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: catalogue
    steps:
      - name: Check out this change
        uses: actions/checkout@v7
        with:
          path: bilibi
      - name: Collect the sets that passed
        uses: actions/download-artifact@v7
        with:
          pattern: tested-*
          path: sets
      - name: Publish the catalogue with the tested sets
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          records=$(find sets -name tested-set.json | sort)
          if [ -z "$records" ]; then
            echo "::warning::No Domain passed, so nothing was recorded"
          fi
          for attempt in 1 2 3; do
            rm -rf published
            if git clone --quiet --branch catalogue --single-branch --depth 1 "$remote" published 2>/dev/null; then
              :
            else
              git init --quiet --initial-branch catalogue published
            fi
            # shellcheck disable=SC2086
            python3 bilibi/scripts/catalogue.py publish --from bilibi/catalogue.json --into published/catalogue.json --record $records
            git -C published add catalogue.json
            git -C published -c user.name=github-actions -c user.email=github-actions@github.com \
              commit --quiet --allow-empty -m "Record tested sets from $GITHUB_WORKFLOW run $GITHUB_RUN_ID ($GITHUB_REF_NAME)"
            if git -C published push --quiet "$remote" HEAD:refs/heads/catalogue; then
              echo "Published https://raw.githubusercontent.com/$GITHUB_REPOSITORY/catalogue/catalogue.json" | tee -a "$GITHUB_STEP_SUMMARY"
              python3 -c "import json;[print('  tested:', s['domain']['id'], s['domain']['version'] or s['domain']['commit'][:12], 'with Bilibi', s['platform']['version'] or s['platform']['commit'][:12]) for s in json.load(open('published/catalogue.json'))['tested']]" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected on attempt $attempt; another run wrote first, retrying"
          done
          exit 1
