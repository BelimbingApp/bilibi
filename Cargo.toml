[workspace]
members = ["apps/base", "apps/core", "apps/domains", "apps/extensions", "apps/installer", "apps/web", "fixtures/walkthrough"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
tower-http = { version = "0.6.11", features = ["compression-gzip", "compression-br"] }
axum = { version = "0.8", features = ["ws", "form"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
jiff = "0.2.38"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.12.1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2.190"
thiserror = "2"
argon2 = "0.6"
askama = "0.16"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Release archives: gzip-compressed tar files, checked with SHA-256.
tar = "0.4.44"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.11"
# Keyed digests: signed streams (Media), webhook signatures (Integration, People connector).
hmac = "0.13.0"
futures-core = "0.3"
# Outgoing HTTPS (base/integration) trusts the server's own CA store too.
rustls-native-certs = "0.8"
# Authenticator two-factor (Core User): RFC 6238 over RustCrypto SHA-1, the
# base32 key, the otpauth label and the QR code drawn server-side as SVG.
sha1 = "0.11"
data-encoding = "2.11"
percent-encoding = "2.3"
url = "2.5.8"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
bilibi-web = { path = "apps/web" }
bilibi-database = { path = "apps/base/database" }
bilibi-audit = { path = "apps/base/audit" }
bilibi-security = { path = "apps/base/security" }
bilibi-ui = { path = "apps/base/ui" }
bilibi-user = { path = "apps/core/user" }
bilibi-company = { path = "apps/core/company" }

inventory = "0.3"
bilibi-module-registry = { path = "apps/base/module_registry" }
bilibi-base = { path = "apps/base" }
bilibi-core = { path = "apps/core" }
bilibi-domains = { path = "apps/domains" }
bilibi-extensions = { path = "apps/extensions" }

