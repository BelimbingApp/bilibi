[workspace]
members = ["apps/base", "apps/core", "apps/domains", "apps/extensions", "apps/web", "fixtures/walkthrough"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "form"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
argon2 = "0.6"
askama = "0.16"
# Authenticator two-factor (Core User): RFC 6238 over RustCrypto SHA-1, the
# base32 key, the otpauth label and the QR code drawn server-side as SVG.
sha1 = "0.11"
data-encoding = "2.11"
percent-encoding = "2.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
bilibi-database = { path = "apps/base/database" }
bilibi-audit = { path = "apps/base/audit" }
bilibi-security = { path = "apps/base/security" }
bilibi-ui = { path = "apps/base/ui" }
bilibi-user = { path = "apps/core/user" }
bilibi-company = { path = "apps/core/company" }

inventory = "0.3"
bilibi-module-registry = { path = "apps/base/module_registry" }
bilibi-base = { path = "apps/base" }
bilibi-core = { path = "apps/core" }
bilibi-domains = { path = "apps/domains" }
bilibi-extensions = { path = "apps/extensions" }

bilibi-notifications = { path = "apps/base/notifications" }
bilibi-menu = { path = "apps/base/menu" }
bilibi-principal-directory = { path = "apps/base/principal_directory" }
bilibi-agent-api = { path = "apps/base/agent_api" }
bilibi-artifacts = { path = "apps/base/artifacts" }
bilibi-audit-views = { path = "apps/base/audit_views" }
bilibi-authz = { path = "apps/base/authz" }
bilibi-dashboard = { path = "apps/base/dashboard" }
bilibi-datetime = { path = "apps/base/datetime" }
bilibi-events = { path = "apps/base/events" }
bilibi-design-library = { path = "apps/base/design_library" }
bilibi-grid = { path = "apps/base/grid" }
bilibi-integration = { path = "apps/base/integration" }
bilibi-locale = { path = "apps/base/locale" }
bilibi-mail = { path = "apps/base/mail" }
bilibi-media = { path = "apps/base/media" }
bilibi-party-ids = { path = "apps/base/party_ids" }
bilibi-perf = { path = "apps/base/perf" }
bilibi-ports = { path = "apps/base/ports" }
bilibi-queue = { path = "apps/base/queue" }
bilibi-schedule = { path = "apps/base/schedule" }
bilibi-session = { path = "apps/base/session" }
bilibi-settings = { path = "apps/base/settings" }
bilibi-settings-editor = { path = "apps/base/settings_editor" }
bilibi-step-up = { path = "apps/base/step_up" }
bilibi-system = { path = "apps/base/system" }
bilibi-tenancy = { path = "apps/base/tenancy" }
bilibi-tiling = { path = "apps/base/tiling" }
bilibi-workflow = { path = "apps/base/workflow" }
bilibi-address = { path = "apps/core/address" }
bilibi-affiliation = { path = "apps/core/affiliation" }
bilibi-agent-access = { path = "apps/core/agent_access" }
bilibi-geonames = { path = "apps/core/geonames" }
bilibi-party = { path = "apps/core/party" }
bilibi-person = { path = "apps/core/person" }
bilibi-user-administration = { path = "apps/core/user_administration" }

# Money and quantities in numeric(20,4) columns, for Domain modules.
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
